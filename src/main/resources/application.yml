# =============================================================================
# VoltForge API — Application Configuration
# =============================================================================

server:
  port: 2001
  servlet:
    context-path: /voltForge-app

spring:
  application:
    name: voltforge-app

  profiles:
    active: dev

  # ── Datasource ──────────────────────────────────────────────────────────────
  datasource:
    url: ${VOLTFORGE_DB_URL:jdbc:mysql://100.73.197.23:3306/voltforge_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${VOLTFORGE_DB_USERNAME:root}
    password: ${VOLTFORGE_DB_PASSWORD:SIva@7482}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: VoltForge-HikariCP
      # ── Scaled for heavy collaborative load (hundreds of concurrent WS sessions) ──
      maximum-pool-size: 100
      minimum-idle: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
      # Validate connections every 30 s to evict stale ones before they error
      keepalive-time: 30000
      # Alert on connections held > 60 s — catches slow WS canvas-save code paths
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
        # Batch fetching to reduce N+1 queries on project/code-file joins
        default_batch_fetch_size: 30

  # ── Flyway ─────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-on-validation-error: false
    clean-disabled: true

  # ── Jackson ────────────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ── OAuth2 Resource Server (Keycloak) ──────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://copious-opposite-mangle.ngrok-free.dev/realms/voltforge-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://copious-opposite-mangle.ngrok-free.dev/realms/voltforge-realm/protocol/openid-connect/certs}

# ── Keycloak Custom Properties ───────────────────────────────────────────────
keycloak:
  enabled: ${KEYCLOAK_ENABLED:false}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:https://copious-opposite-mangle.ngrok-free.dev}
  realm: ${KEYCLOAK_REALM:voltforge-realm}
  resource: ${KEYCLOAK_CLIENT_ID:VOLT-Canvas}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:}


# ── CORS ─────────────────────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:2001,https://copious-opposite-mangle.ngrok-free.dev}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600


  rate-limit:
    requests-per-minute: 60
  ai:
    model:
      url: ${VOLTFORGE_AI_URL:http://localhost:2002/voltForge-ai}
      timeout: 15
  simulation:
    compiler:
      # REMOTE posts { sketch, fqbn, boardType } to a compiler service.
      # ARDUINO_CLI runs arduino-cli locally on this backend host.
      mode: ${AVR_COMPILER_MODE:REMOTE}
      remote-url: ${AVR_COMPILER_URL:https://hexi.wokwi.com/build}
      arduino-cli-path: ${ARDUINO_CLI_PATH:arduino-cli}
      timeout-seconds: ${AVR_COMPILER_TIMEOUT:45}

# ── SpringDoc / Swagger ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    in.voltforge.api: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
