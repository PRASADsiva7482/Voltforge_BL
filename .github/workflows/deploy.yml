name: Deploy VoltForge Backend (BL) to Azure

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or Version to Deploy (e.g. v1.0.0-dev-20260923001 or v1.0.0-qa-20260923001)'
        required: false
        default: 'latest'

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java & Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build Executable Spring Boot JAR
        run: |
          mvn clean package -DskipTests
          JAR_FILE=$(ls target/*.jar | head -n 1)
          cp "$JAR_FILE" voltforge-bl.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Image Metadata & Tag Rule
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/voltforge-bl"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          # Tag mapping for dev, qa, and latest channels
          TAGS_LIST="${IMAGE}:${TAG},${IMAGE}:latest"
          if [[ "${TAG}" == *"-dev-"* ]]; then
            TAGS_LIST="${TAGS_LIST},${IMAGE}:dev"
          elif [[ "${TAG}" == *"-qa-"* ]]; then
            TAGS_LIST="${TAGS_LIST},${IMAGE}:qa"
          fi

          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "TAGS_LIST=${TAGS_LIST}" >> $GITHUB_ENV
          echo "Image target: ${IMAGE}:${TAG}"

      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.TAGS_LIST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach Compiled JAR Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ env.TAG }}"
          files: voltforge-bl.jar
          generate_release_notes: true
          body: |
            ### VoltForge Backend Production Artifacts
            * **Container Image (GHCR):** `${{ env.IMAGE }}:${{ env.TAG }}` *(Alpine JRE + compiled JAR only — zero Java source code)*
            * **Attached JAR File:** `voltforge-bl.jar` *(Standalone executable Spring Boot JAR)*

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            set -e
            echo "[*] Pulling updated image: ${{ env.IMAGE }}:${{ env.TAG }}..."
            docker pull "${{ env.IMAGE }}:${{ env.TAG }}"
            docker tag "${{ env.IMAGE }}:${{ env.TAG }}" "${{ env.IMAGE }}:latest"

            echo "[*] Updating voltforge-bl container on Azure VM..."
            cd /opt/voltforge/azureDeploy
            export BL_IMAGE="${{ env.IMAGE }}:${{ env.TAG }}"
            docker compose up -d --no-deps voltforge-bl

            echo "[+] VoltForge Backend (${{ env.TAG }}) successfully deployed to Azure!"
