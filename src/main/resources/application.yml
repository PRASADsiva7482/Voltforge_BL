# =============================================================================
# VoltForge API — Application Configuration
# =============================================================================

server:
  port: 2001
  servlet:
    context-path: /voltForge-app

spring:
  application:
    name: voltforge-app

  profiles:
    active: dev

  threads:
    virtual:
      enabled: true

  # ── Datasource ──────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/voltforge_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: SIva@7482
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: VoltForge-HikariCP
      # ── Scaled for heavy collaborative load (hundreds of concurrent WS sessions) ──
      maximum-pool-size: 100
      minimum-idle: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
      # Validate connections every 30 s to evict stale ones before they error
      keepalive-time: 30000
      # Alert on connections held > 60 s — catches slow WS canvas-save code paths
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
        # Batch fetching to reduce N+1 queries on project/code-file joins
        default_batch_fetch_size: 30

  # ── Flyway ─────────────────────────────────────────────────────────────────
  flyway:
    # The deployed database already owns schema history 1–4, but this source
    # tree does not ship those migration files. Do not run a partial migration
    # set against the existing database; manage schema changes separately until
    # the complete history is restored.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

  # ── Jackson ────────────────────────────────────────────────────────────────
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ── OAuth2 Resource Server (Keycloak) ──────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/voltforge-realm
          jwk-set-uri: http://localhost:8080/realms/voltforge-realm/protocol/openid-connect/certs

# ── Keycloak Custom Properties ───────────────────────────────────────────────
keycloak:
  enabled: false
  auth-server-url: http://localhost:8080
  realm: voltforge-realm
  resource: VOLT-Canvas
  credentials:
    secret: BpJfF6q1sdld27MOOXonOFC84GZlHyrC


# ── CORS ─────────────────────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600


  rate-limit:
    requests-per-minute: 60
    trust-forwarded-headers: false
  ai:
    environment: development
    model:
      url: http://localhost:2002/voltForge-ai
      timeout: 15
      streaming-timeout: 60
      # Private backend-to-AI credential. It is never returned to the browser.
      api-token: ""
    gateway:
      max-request-bytes: 2000000
      max-concurrent-streams-per-user: 2
      max-concurrent-streams-per-project: 1
  simulation:
    compiler:
      # REMOTE posts { sketch, fqbn, boardType } to a compiler service.
      # ARDUINO_CLI runs arduino-cli locally on this backend host.
      mode: REMOTE
      remote-url: https://hexi.wokwi.com/build
      arduino-cli-path: arduino-cli
      timeout-seconds: 45

# ── SpringDoc / Swagger ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    in.voltforge.api: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

---
# MySQL transport/session bounds. H2 regression tests use the test profile.
spring:
  config:
    activate:
      on-profile: "!test"
  datasource:
    hikari:
      # Bound orphan transactions if a network reset prevents client rollback.
      # Existing 30 s keepalive keeps healthy pooled connections alive.
      connection-init-sql: SET SESSION wait_timeout=60, innodb_lock_wait_timeout=5
      data-source-properties:
        useCompression: true
        connectTimeout: 5000
        socketTimeout: 15000
        tcpKeepAlive: true
